<main>
    <h1>Iniciar Sesión</h1>
    <form (ngSubmit)="iniciarSesion()">
        <label for="usuario">Usuario </label>
        <input id="usuario" name="usuario" [(ngModel)]="usuario" required><br><br>
        <label for="clave">Clave.    </label>
        <input id="clave" name="clave" type="password" [(ngModel)]="clave" required><br><br>
        <button type="Submit">Ingresar</button>
    </form>
</main>
